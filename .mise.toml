[settings]
    python.uv_venv_auto = "create|source"

[tools]
    "pipx:bump-my-version" = "latest"
    "pipx:ruff"            = "0.15"
    python                 = "3.14"
    tombi                  = "latest"
    uv                     = "latest"

[tasks.lint]
    description = "Check the project"
    depends     = ["sync"]
    run         = [
        "tombi lint",
        "ruff check --fix",
    ]

[tasks.bump]
    description = "Bump the patch version"
    depends     = ["pre-commit"]
    run         = "bump-my-version bump patch && git push --follow-tags"

[tasks.format]
    description = "Format the project"
    depends     = ["sync"]
    run         = [
        "tombi format",
        "ruff format",
    ]

[tasks.pre-commit]
    description = "Lint, format, and test the project"
    depends     = ["sync"]
    run         = [
        { task = "lint" },
        { task = "format" },
    ]

[tasks.sync]
    description = "Synchronize the development environment"
    run         = "uv sync"
